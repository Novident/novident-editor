name: novident_editor_rich_text
version: 1.0.3
description: >-
  Rich text paragraph rendering for Novident Editor — widget,
  selection mixin, and abstract editor config. Usable without
  the full editor for lightweight node rendering.
homepage: https://github.com/Novident/
repository: https://github.com/Novident/novident-editor/
issue_tracker: https://github.com/Novident/novident-editor/issues

environment:
  sdk: ">=3.4.3 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  novident_editor_document: ^1.0.5
  novident_editor_core: ^1.0.2
  novident_editor_styles: ^1.0.2
  novident_editor_selection: 
    path: ../novident_editor_selection

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
