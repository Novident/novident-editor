name: novident_spell_check_interface
version: 1.0.0
description: >-
  Pure-Dart contract for spell-check integration in the Novident suite.
  Defines NovidentSpellChecker, SpellCheckIssue and proof-segment helpers.
  Independent of Flutter and of the editor.
