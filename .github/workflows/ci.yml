# CI: runs on every push to master and every pull request targeting master.
#
# The repository is a monorepo: the root package plus the extracted layers
# under packages/ and the example app. Each one is analyzed and tested with
# its own pubspec (path dependencies resolve within the checkout).
#
# To block PRs that fail these checks, enable branch protection on master:
#   Settings → Branches → Branch protection rules → "Require status checks
#   to pass before merging" → select "Analyze & test".

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Get dependencies (root)
        run: flutter pub get

      - name: Analyze (root)
        # Scope to lib/ + test/ only: the root package consumes the extracted
        # layers via pub.dev (hosted), not path deps, so packages/ must not be
        # analyzed from the root context. In a fresh checkout packages/* have no
        # .dart_tool/package_config.json yet, so an unscoped `flutter analyze`
        # descends into them and resolves their self-imports against the hosted
        # versions, producing phantom type-identity errors. Each package is
        # analyzed correctly (and independently) in the loop below.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Test (root)
        run: flutter test

      - name: Analyze & test packages
        run: |
          set -e
          for package in packages/*/; do
            if [ ! -f "${package}pubspec.yaml" ]; then
              continue
            fi
            echo "==> ${package}"
            (
              cd "${package}"
              flutter pub get
              flutter analyze --no-fatal-infos --no-fatal-warnings
              if [ -d test ]; then
                flutter test
              else
                echo "(no tests)"
              fi
            )
          done

      - name: Analyze example
        run: |
          set -e
          cd example
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
