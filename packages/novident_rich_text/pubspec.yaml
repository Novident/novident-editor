name: novident_rich_text
version: 1.0.0
description: >-
  Rich text paragraph rendering for Novident Editor — widget,
  selection mixin, and abstract editor config. Usable without
  the full editor for lightweight node rendering.
homepage: https://github.com/Novident/
repository: https://github.com/Novident/novident-editor/
issue_tracker: https://github.com/Novident/novident-editor/issues

environment:
  sdk: ">=3.4.3 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  novident_editor_document:
    path: ../novident_document
  novident_core:
    path: ../novident_core
  novident_styles:
    path: ../novident_styles
  novident_selection:
    path: ../novident_selection

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
